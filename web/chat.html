<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --border: #2a2f3a;
    --text: #e6e9ef; --muted: #8b93a3; --accent: #4f8cff; --user: #2b4a8b;
    --assistant: #1e222b; --danger: #ff6b6b; --ok: #3ecf8e; --warn: #ffb454;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --panel2: #eef0f4; --border: #dfe3ea;
      --text: #1b1f27; --muted: #666e7d; --accent: #2f6bff; --user: #dce8ff;
      --assistant: #eef0f4;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header .logo { font-size: 20px; }
  header .title { font-weight: 600; }
  header .status { margin-left: auto; font-size: 12px; color: var(--muted); }
  header .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 5px; vertical-align: middle; }
  header .dot.ok { background: var(--ok); } header .dot.err { background: var(--danger); }

  /* Pestañas — mismo patrón que Bitácola (.tabs / .tab-btn / .tab-panel) */
  .tabs { display: flex; gap: 4px; padding: 6px 12px 0; background: var(--panel); border-bottom: 2px solid var(--border); overflow-x: auto; }
  .tab-btn {
    padding: 10px 20px; border: none; border-radius: 8px 8px 0 0;
    background: var(--panel2); color: var(--muted);
    font-size: 13px; font-weight: 700; text-transform: uppercase;
    cursor: pointer; white-space: nowrap;
  }
  .tab-btn.active { background: var(--bg); color: var(--text); }
  .tab-panel { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .tab-panel.active { display: flex; }

  /* --- Chat --- */
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: min(760px, 92%); padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: var(--assistant); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg .tag { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .msg.pending { opacity: .6; font-style: italic; }
  .msg strong { font-weight: 700; }
  .msg em { font-style: italic; }
  .msg code { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 90%; }
  .msg ul, .msg ol { margin: 6px 0; padding-left: 22px; }
  .msg li { margin: 3px 0; }
  .empty { color: var(--muted); text-align: center; margin: auto; padding: 20px; }

  form { border-top: 1px solid var(--border); background: var(--panel); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 3px 8px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .chip button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; line-height: 1; padding: 0; }
  .row { display: flex; align-items: flex-end; gap: 8px; }
  textarea {
    flex: 1; resize: none; max-height: 40vh; min-height: 24px;
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 12px; font: inherit; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .btn { border-radius: 12px; padding: 0 14px; height: 44px; cursor: pointer; font-size: 18px; background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
  .btn.send { background: var(--accent); color: #fff; border: none; font-weight: 600; }
  .btn:disabled { opacity: .5; cursor: default; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 6px; text-align: center; }

  /* --- Paneles de datos (Alpha50 / Netscan / Audit) --- */
  .subtabs { display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .sub-btn { border: 1px solid var(--border); background: var(--panel2); color: var(--muted); border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .sub-btn.active { background: var(--accent); color: #fff; border-color: transparent; }
  .sub-btn.reload { margin-left: auto; }
  .sub-title { font-size: 12px; font-weight: 600; color: var(--muted); }
  .pane { flex: 1; overflow-y: auto; padding: 14px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 6px; font-size: 15px; }
  .meta { font-size: 12px; color: var(--muted); }
  .kpis { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
  .kpi { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px; font-size: 13px; }
  pre.txt { white-space: pre-wrap; word-wrap: break-word; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 13px; max-height: 320px; overflow: auto; margin: 8px 0 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; }
  .tblwrap { overflow-x: auto; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--border); }
  .pill.done { color: var(--ok); } .pill.error { color: var(--danger); } .pill.running { color: var(--warn); }
</style>
</head>
<body>
  <header>
    <span class="logo">🤖</span>
    <span class="title">Jarvis</span>
    <span class="status"><span id="dot" class="dot"></span><span id="statusText">conectando…</span></span>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="chat">💬 Chat</button>
    <button class="tab-btn" data-tab="alpha50">💪 Alpha50</button>
    <button class="tab-btn" data-tab="scan">🛰️ Netscan / Audit</button>
  </div>

  <!-- ---------------- CHAT ---------------- -->
  <div class="tab-panel active" id="panel-chat">
    <div id="log"><div class="empty">Cargando historial…</div></div>
    <form id="form">
      <div id="chips"></div>
      <div class="row">
        <input id="files" type="file" multiple hidden>
        <input id="folder" type="file" webkitdirectory multiple hidden>
        <button type="button" class="btn" id="attachBtn" title="Adjuntar archivo">📎</button>
        <button type="button" class="btn" id="folderBtn" title="Adjuntar carpeta">📁</button>
        <textarea id="input" rows="1" placeholder="Escribe a Jarvis…  (Enter envía · Shift+Enter salto de línea)"></textarea>
        <button type="submit" class="btn send" id="sendBtn" title="Enviar">➤</button>
      </div>
      <div class="hint">Enter envía · Shift+Enter nueva línea · 📎 adjunta archivos (se leen y se mandan como contexto)</div>
    </form>
  </div>

  <!-- ---------------- ALPHA50 ---------------- -->
  <div class="tab-panel" id="panel-alpha50">
    <div class="subtabs">
      <span class="sub-title">💪 Entrenamiento · método Fitness 12 semanas</span>
      <button class="sub-btn reload" id="reloadAlpha" title="Recargar">🔄</button>
    </div>
    <div class="pane" id="resAlpha"><div class="empty">Cargando…</div></div>
  </div>

  <!-- ---------------- NETSCAN / AUDIT ---------------- -->
  <div class="tab-panel" id="panel-scan">
    <div class="subtabs">
      <button class="sub-btn active" data-sub="netscan">🛰️ Netscan</button>
      <button class="sub-btn" data-sub="audit">🔍 Auditoría</button>
      <button class="sub-btn reload" id="reloadScan" title="Recargar">🔄</button>
    </div>
    <div class="pane" id="resScan"><div class="empty">Cargando…</div></div>
  </div>

<script>window.JARVIS_KEY = "__JARVIS_KEY__";</script>
<script>
const $ = (s) => document.querySelector(s);
const log = $("#log"), input = $("#input"), form = $("#form"),
      chipsBox = $("#chips"), sendBtn = $("#sendBtn"),
      dot = $("#dot"), statusText = $("#statusText"),
      resAlpha = $("#resAlpha"), resScan = $("#resScan");

const MAX_FILE = 80 * 1024, MAX_TOTAL = 200 * 1024;
let attachments = [], busy = false, currentScanSub = "netscan";

// ---- Clave API: la inyecta el servidor en la página (window.JARVIS_KEY) ----
function getKey() { return (typeof window.JARVIS_KEY === "string" ? window.JARVIS_KEY : "") || ""; }
function headers() {
  const h = { "Content-Type": "application/json" };
  const k = getKey(); if (k) h["X-Jarvis-Key"] = k;
  return h;
}
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { ...headers(), ...(opts.headers || {}) } });
  if (r.status === 401) throw new Error("Clave rechazada (401). Revisa JARVIS_API_KEY en el .env y reinicia el servicio.");
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r;
}
function setStatus(ok, txt) { dot.className = "dot " + (ok ? "ok" : "err"); statusText.textContent = txt; }
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Markdown ligero: negrita, código, listas y saltos. Escapa HTML primero (seguro).
function mdToHtml(src) {
  let s = esc(src);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  const lines = s.split("\n");
  let out = "", ul = false, ol = false;
  const close = () => { if (ul) { out += "</ul>"; ul = false; } if (ol) { out += "</ol>"; ol = false; } };
  for (const line of lines) {
    const mUl = line.match(/^\s*[-*]\s+(.*)$/);
    const mOl = line.match(/^\s*\d+[.)]\s+(.*)$/);
    const mH = line.match(/^\s*#{1,4}\s+(.*)$/);
    if (mUl) { if (ol) { out += "</ol>"; ol = false; } if (!ul) { out += "<ul>"; ul = true; } out += "<li>" + mUl[1] + "</li>"; }
    else if (mOl) { if (ul) { out += "</ul>"; ul = false; } if (!ol) { out += "<ol>"; ol = true; } out += "<li>" + mOl[1] + "</li>"; }
    else if (mH) { close(); out += "<strong>" + mH[1] + "</strong><br>"; }
    else if (line.trim() === "") { close(); out += "<br>"; }
    else { close(); out += line + "<br>"; }
  }
  close();
  return out;
}

// ---- Pestañas (patrón Bitácola) ----
function switchTab(name) {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + name));
  if (name === "chat") input.focus();
  if (name === "alpha50") loadAlpha50();
  if (name === "scan") loadScan(currentScanSub);
}
document.querySelectorAll(".tab-btn").forEach(b => b.onclick = () => switchTab(b.dataset.tab));
document.querySelectorAll(".sub-btn[data-sub]").forEach(b => b.onclick = () => {
  currentScanSub = b.dataset.sub;
  document.querySelectorAll(".sub-btn[data-sub]").forEach(x => x.classList.toggle("active", x === b));
  loadScan(currentScanSub);
});
$("#reloadAlpha").onclick = () => loadAlpha50();
$("#reloadScan").onclick = () => loadScan(currentScanSub);

// ---- Chat ----
function addMsg(role, text, tag) {
  const empty = log.querySelector(".empty"); if (empty) empty.remove();
  const el = document.createElement("div");
  el.className = "msg " + (role === "user" ? "user" : "assistant");
  if (tag) { const t = document.createElement("div"); t.className = "tag"; t.textContent = tag; el.appendChild(t); }
  const body = document.createElement("div");
  if (role === "user") body.textContent = text;      // input propio: texto plano
  else body.innerHTML = mdToHtml(text);              // respuesta: markdown formateado
  el.appendChild(body);
  log.appendChild(el); log.scrollTop = log.scrollHeight;
  return el;
}
async function loadHistory() {
  try {
    const rows = await (await api("/history?limit=40")).json();
    log.innerHTML = "";
    if (!rows.length) log.innerHTML = '<div class="empty">Sin conversaciones aún. Escribe algo 👇</div>';
    for (const m of rows) addMsg(m.role, m.message);
    setStatus(true, "conectado");
  } catch (e) {
    log.innerHTML = '<div class="empty">No pude cargar el historial: ' + esc(e.message) + '</div>';
    setStatus(false, "sin conexión");
  }
}
function renderChips() {
  chipsBox.innerHTML = "";
  attachments.forEach((a, i) => {
    const c = document.createElement("div"); c.className = "chip";
    c.innerHTML = "📄 " + esc(a.name) + " <button title='Quitar'>✕</button>";
    c.querySelector("button").onclick = () => { attachments.splice(i, 1); renderChips(); };
    chipsBox.appendChild(c);
  });
}
function readAsText(file) {
  return new Promise((resolve) => {
    if (file.size > MAX_FILE) { resolve(null); return; }
    const r = new FileReader();
    r.onload = () => resolve(String(r.result || "")); r.onerror = () => resolve(null);
    r.readAsText(file);
  });
}
async function addFiles(fileList) {
  let total = attachments.reduce((n, a) => n + a.text.length, 0);
  for (const f of fileList) {
    const txt = await readAsText(f); if (txt === null) continue;
    if (total + txt.length > MAX_TOTAL) { alert("Adjuntos demasiado grandes; se omitió " + f.name); continue; }
    total += txt.length;
    attachments.push({ name: f.webkitRelativePath || f.name, text: txt });
  }
  renderChips();
}
$("#attachBtn").onclick = () => $("#files").click();
$("#folderBtn").onclick = () => $("#folder").click();
$("#files").onchange = (e) => { addFiles(e.target.files); e.target.value = ""; };
$("#folder").onchange = (e) => { addFiles(e.target.files); e.target.value = ""; };

function buildMessage(text) {
  let msg = text.trim();
  for (const a of attachments) msg += "\n\n[Archivo adjunto: " + a.name + "]\n" + a.text + "\n[Fin del archivo]";
  return msg;
}
async function send() {
  if (busy) return;
  const text = input.value;
  if (!text.trim() && attachments.length === 0) return;
  const shown = text.trim() + (attachments.length ? "\n📎 " + attachments.map(a => a.name).join(", ") : "");
  addMsg("user", shown || "(archivos adjuntos)");
  const payload = buildMessage(text);
  input.value = ""; autoGrow();
  const pend = addMsg("assistant", "escribiendo…"); pend.classList.add("pending");
  busy = true; sendBtn.disabled = true;
  try {
    const data = await (await api("/chat", { method: "POST", body: JSON.stringify({ message: payload }) })).json();
    pend.remove(); addMsg("assistant", data.response || "(sin respuesta)");
    attachments = []; renderChips(); setStatus(true, "conectado");
  } catch (e) {
    pend.remove(); addMsg("assistant", "⚠️ " + e.message); setStatus(false, "error");
  } finally { busy = false; sendBtn.disabled = false; input.focus(); }
}
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
form.addEventListener("submit", (e) => { e.preventDefault(); send(); });
function autoGrow() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, window.innerHeight * 0.4) + "px"; }
input.addEventListener("input", autoGrow);

// ---- Alpha50 ----
async function loadAlpha50() {
  resAlpha.innerHTML = '<div class="empty">Cargando…</div>';
  try { renderAlpha50(await (await api("/results/alpha50?dias=14")).json()); }
  catch (e) { resAlpha.innerHTML = '<div class="empty">⚠️ ' + esc(e.message) + '</div>'; }
}
function renderAlpha50(d) {
  if (!d || d.error) { resAlpha.innerHTML = '<div class="empty">' + esc((d && d.error) || "Sin datos de Alpha50.") + '</div>'; return; }
  let h = "";
  if (d.programa) {
    h += '<div class="card"><h3>💪 Estado del programa</h3><div class="kpis">' +
      Object.entries(d.programa).map(([k, v]) => '<span class="kpi">' + esc(k) + ': <b>' + esc(v) + '</b></span>').join("") +
      '</div></div>';
  }
  const hist = d.historial || [];
  if (hist.length) {
    const cols = Object.keys(hist[0]);
    h += '<div class="card"><h3>📅 Historial (' + hist.length + ' días)</h3><div class="tblwrap"><table><tr>' +
      cols.map(c => '<th>' + esc(c) + '</th>').join("") + '</tr>' +
      hist.map(r => '<tr>' + cols.map(c => '<td>' + esc(r[c]) + '</td>').join("") + '</tr>').join("") +
      '</table></div></div>';
  } else h += '<div class="empty">Sin días registrados.</div>';
  resAlpha.innerHTML = h;
}

// ---- Netscan / Audit ----
async function loadScan(which) {
  resScan.innerHTML = '<div class="empty">Cargando…</div>';
  try {
    if (which === "netscan") renderNetscan(await (await api("/netscan/last")).json());
    else renderAudit(await (await api("/results/audit?limit=10")).json());
  } catch (e) { resScan.innerHTML = '<div class="empty">⚠️ ' + esc(e.message) + '</div>'; }
}
function renderNetscan(r) {
  if (!r || !r.timestamp) { resScan.innerHTML = '<div class="empty">Sin escaneos todavía. Pídele a Jarvis "escanea mi red".</div>'; return; }
  const sev = (r.summary && r.summary.cve_by_severity) || {};
  let h = '<div class="card"><h3>🛰️ Último escaneo</h3>' +
    '<div class="meta">🕒 ' + esc(r.timestamp) + ' · 🌐 ' + esc(r.subnet) + ' · 📶 ' + esc(r.host_count) + ' dispositivos · ⚙️ ' + esc(r.backend) + '</div>' +
    '<div class="kpis">' +
      '<span class="kpi">🔴 ' + (sev.CRITICAL || 0) + ' críticas</span>' +
      '<span class="kpi">🟠 ' + (sev.HIGH || 0) + ' altas</span>' +
      '<span class="kpi">🟡 ' + (sev.MEDIUM || 0) + ' medias</span>' +
      '<span class="kpi">🔵 ' + (sev.LOW || 0) + ' bajas</span>' +
    '</div>';
  if (r.analysis) h += '<h3>🧠 Análisis</h3><pre class="txt">' + esc(r.analysis) + '</pre>';
  h += '</div>';
  for (const host of (r.hosts || [])) {
    h += '<div class="card"><h3>' + esc(host.ip) + ' · ' + esc(host.device_type || "?") + '</h3>' +
         '<div class="meta">' + esc(host.vendor || "") + (host.os_guess ? " · " + esc(host.os_guess) : "") + '</div>';
    const ports = (host.ports || []).map(p => p.port + "/" + (p.service || "tcp")).join(", ");
    if (ports) h += '<div class="meta">🔌 ' + esc(ports) + '</div>';
    for (const f of (host.risk_flags || [])) h += '<div class="meta">⚠️ ' + esc(f) + '</div>';
    for (const fi of (host.cve_findings || [])) for (const c of (fi.cves || []).slice(0, 3))
      h += '<div class="meta">🔎 ' + esc(c.id) + ' (' + esc(c.severity) + ', CVSS ' + esc(c.cvss ?? "?") + ') · ' + esc(fi.product) + '</div>';
    h += '</div>';
  }
  resScan.innerHTML = h;
}
function renderAudit(jobs) {
  if (!jobs || !jobs.length) { resScan.innerHTML = '<div class="empty">Sin auditorías todavía.</div>'; return; }
  resScan.innerHTML = jobs.map(j =>
    '<div class="card"><h3>🔍 #' + esc(j.id) + ' · <span class="pill ' + esc(j.status) + '">' + esc(j.status) + '</span></h3>' +
    '<div class="meta">' + esc(j.repo_path) + '</div>' +
    '<div class="meta">🕒 ' + esc(j.started || "?") + (j.finished ? " → " + esc(j.finished) : "") + '</div>' +
    (j.error ? '<div class="meta">⚠️ ' + esc(j.error) + '</div>' : "") +
    (j.summary ? '<pre class="txt">' + esc(j.summary) + '</pre>' : '<div class="meta">(sin resumen ejecutivo)</div>') +
    '</div>').join("");
}

loadHistory();
input.focus();
</script>
</body>
</html>
